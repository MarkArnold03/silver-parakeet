name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build --configuration Release
      # Unit tests, then integration tests. The integration tests start SQL Server in Docker
      # themselves (Testcontainers), and Docker is preinstalled on GitHub's Ubuntu runners.
      - run: dotnet test --configuration Release --no-build
