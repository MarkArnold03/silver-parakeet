name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build --configuration Release
      # Unit tests, then integration tests. The integration tests start SQL Server in Docker
      # themselves (Testcontainers), and Docker is preinstalled on GitHub's Ubuntu runners.
      - run: dotnet test --configuration Release --no-build
      # "dotnet build" rewrites the API description. If that changed the file, someone changed the
      # API without committing the new description, and the frontend's types would be out of date.
      - name: The committed API description matches the code
        run: git diff --exit-code -- ../frontend/packages/api/openapi.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: The committed TypeScript types match the API description
        run: pnpm gen:api && git diff --exit-code -- packages/api/src/schema.d.ts
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
